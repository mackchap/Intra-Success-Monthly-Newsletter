services:
  postgres:
    image: postgres:16-alpine
    container_name: isa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: intra_success_academy
    ports:
      - "5432:5432"
    volumes:
      - isa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: isa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - isa-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  isa-postgres-data:
  isa-redis-data:
